name: pages

# Publishes the static full-body lab (index.html + committed assets) to GitHub Pages.
# The lab runs entirely client-side; without the local AI proxy the page falls back to
# the built-in MoonBit motion engine, which is the documented offline behaviour.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the static site from committed files only
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html _site/
          rsync -a --exclude 'environment/source/' assets/ _site/assets/
          touch _site/.nojekyll
          du -sh _site
          test -f _site/assets/runtime/moonbit-core.js
          test -f _site/assets/anatomy/human-atlas/rigged-body.glb
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
